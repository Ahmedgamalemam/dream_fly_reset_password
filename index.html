<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Port Said</title>

    <style>
      body {
        font-family: Nunito !important;
        overflow-x: hidden;
        background-color: rgba(0, 0, 0, 0.5) !important;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      main {
        background: #ffffff;
        display: flex;
        flex-direction: row;
        gap: 20px;
        justify-content: space-between;
        align-items: center;
        width: 80%;
        height: 90%;
        border-radius: 20px;
        padding: 14px 28px;
      }
      section {
        width: 50%;
      }

      .background-logo {
        width: 50%;
        height: 100%;
      }

      img {
        width: 100%;
        height: 100%;
      }

      form {
        width: 50%;
      }

      input[type="email"],
      #emailVerificationCode {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #eaeaea !important;
        margin-bottom: 1rem;
        outline: 0;
      }

      input[type="email"]::placeholder {
        color: #cacaca;
      }

      #cancel {
        display: none !important;
      }

      .attrEntry #email_label,
      #emailVerificationCode_label {
        display: none !important;
      }

      .verifyCode,
      .sendNewCode,
      .changeClaims {
        background: #369be7 !important;
        border-radius: 0.5rem !important;
      }

      #emailVerificationControl_but_send_code {
        width: 100%;
        padding: 0.2rem;
        border-radius: 0.5rem;
        background: #369be7;
        color: white;
        border: none;
      }

      .helpLink,
      .heading,
      .intro p {
        display: none !important;
      }

      ul {
        padding-left: 0 !important;
      }
      li::marker {
        content: "";
      }

      /* /////////////////////////////////fonts//////////////////////////////////////////// */

      @font-face {
        font-family: "Nunito";
        src: url("https://ahmedgamalemam.github.io/b2c-login-page/fonts/NunitoSans_7pt_Condensed-Regular.ttf")
          format("truetype");
      }

      @font-face {
        font-family: "Urbanist";
        src: url("https://ahmedgamalemam.github.io/b2c-login-page/fonts/Urbanist-Black.ttf")
          format("truetype");
      }

      #continue {
        width: 100%;
        padding: 0.2rem;
        border-radius: 0.5rem;
        background: #369be7;
        color: white;
        border: none;
      }

      @media (max-width: 840px) {
        section {
          width: 100%;
        }
        .background-logo {
          display: none;
        }
      }
    </style>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <main>
      <section>
        <h3 class="head-title" style="font-weight: 600">
          Get Started with Dream & Fly
        </h3>
        <p class="title" style="color: #242456">
          Enter your email address to continue
        </p>

        <form id="api" method="post" autocomplete="off">
          <input
            id="email"
            name="email"
            type="email"
            placeholder="Email Address"
            required
          />
        </form>
      </section>
      <div class="background-logo">
        <img src="images/light-bg.png" alt="logo" />
      </div>
    </main>
  </body>
</html>
